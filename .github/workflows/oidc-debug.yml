name: oidc-debug

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Print raw OIDC token claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "=== JWT header ==="
          echo "$TOKEN" | cut -d. -f1 | base64 -d 2>/dev/null | jq .
          echo "=== JWT claims ==="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, ref, repository, actor, event_name, workflow, job, runner_environment}'
